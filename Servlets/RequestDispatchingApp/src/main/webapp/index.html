<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Web Application</title>
</head>
<body bgcolor="#7fffd4" style="align-content: center">
<h1>Welcome to Registration Web Application</h1>
<h2>Kindly register to proceed further</h2>

<form method="post" action="./FirstServlet">
    <table>
        <tr>
            <td>User Name:</td>
            <td><input type="text" name="username"></td>
        </tr>

        <tr>
            <td>User City:</td>
            <td><input type="text" name="city"></td>
        </tr>

        <tr>
            <td><input type="submit" value="SignUp"></td>
        </tr>
    </table>
</form>

</body>
</html>
